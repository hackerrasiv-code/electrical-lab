name: Build Electrical Lab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract and Locate Project
        run: |
          echo "=== Unzipping project ==="
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No .zip file found in repository root."
            exit 1
          fi
          
          unzip -q "$ZIP_FILE" -d project
          
          # Locate the ElectricalLab folder containing settings.gradle
          PROJECT_DIR=$(find project -type f -name "settings.gradle" -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::settings.gradle not found in extracted files."
            exit 1
          fi
          
          echo "Found project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          
          echo "Generating required Gradle 8.9 wrapper..."
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          
          echo "Building debug APK..."
          ./gradlew assembleDebug --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalLab-APK
          path: '**/build/outputs/apk/debug/*.apk'

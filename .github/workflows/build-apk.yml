name: Build Electrical Lab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Project
        run: |
          echo "=== Files in workspace ==="
          ls -la
          
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No .zip file found in the repository root!"
            exit 1
          fi
          
          echo "Found zip file: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          
          echo "=== Full file tree of extracted project ==="
          find project -maxdepth 3
          
          # Find the root directory containing settings.gradle or build.gradle
          PROJECT_DIR=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find project -type f -name "build.gradle" -printf '%h\n' | head -n 1)
          fi
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find Android project structure inside the ZIP."
            exit 1
          fi
          
          echo "Found Android project root at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          
          # Ensure Gradle wrapper exists and uses version 8.9
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating Gradle 8.9 wrapper..."
            gradle wrapper --gradle-version 8.9
          fi
          
          chmod +x gradlew
          
          # Build using the wrapper with info logs
          ./gradlew assembleDebug --info
          
          # Locate the built APK anywhere in the project output directories
          APK_PATH=$(find "$(pwd)" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not generated"
            exit 1
          fi
          
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalLab-APK
          path: ${{ env.APK_PATH }}

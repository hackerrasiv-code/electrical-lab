name: Build Electrical Lab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Project
        run: |
          echo "=== Files in workspace ==="
          ls -la
          
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No .zip file found in the repository root!"
            exit 1
          fi
          
          echo "Found zip file: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          
          echo "=== Contents of unzipped directory ==="
          find project -maxdepth 3
          
          # Broad search: find any directory containing build.gradle, settings.gradle, or AndroidManifest.xml
          PROJECT_DIR=$(find project -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "AndroidManifest.xml" \) -printf '%h\n' | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find Android project structure inside the ZIP."
            exit 1
          fi
          
          echo "Found Android project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found in project root, searching subdirectories..."
            # Look for gradlew nearby if it's nested
            GRADLEW_PATH=$(find . -maxdepth 2 -name "gradlew" -type f | head -n 1)
            if [ -n "$GRADLEW_PATH" ]; then
              cd "$(dirname "$GRADLEW_PATH")"
            else
              echo "Generating fresh gradle wrapper..."
              gradle wrapper
            fi
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug --console plain
          
          APK_PATH=$(find "$(pwd)" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not generated"
            exit 1
          fi
          
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalLab-APK
          path: ${{ env.APK_PATH }}

name: Build Electrical Lab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Project
        run: |
          echo "=== Files in workspace ==="
          ls -la
          
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No .zip file found in the repository root!"
            exit 1
          fi
          
          echo "Found zip file: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          
          # Find the folder containing gradlew or build.gradle
          PROJECT_DIR=$(find project -type f -name "build.gradle" -o -name "build.gradle.kts" -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project files not found inside the ZIP."
            exit 1
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          
          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew wrapper script is missing from your ZIP file!"
            exit 1
          fi
          
          chmod +x gradlew
          
          # Run build and capture/print the exact failure if it happens
          ./gradlew assembleDebug --stacktrace --console plain || {
            echo "=========================================="
            echo "BUILD FAILED: Printing recent build logs:"
            echo "=========================================="
            find . -path "*/build/reports/*" -type f
            exit 1
          }
          
          APK_PATH=$(find "$(pwd)" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::APK not generated"
            exit 1
          fi
          
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalLab-APK
          path: ${{ env.APK_PATH }}
